<!DOCTYPE html>

<html lang="en">
<head>
<link href="cats.png" rel="icon" type="image/png"/>
<meta charset="utf-8"/>
<title>Donny Dump Archive</title>
<script>
    if (sessionStorage.getItem("authorized") !== "true") {
      window.location.href = "donnydump-path.html";
    }
  </script>
<style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0 1rem;
      background: #f4f4f4;
    }

    #content {
      max-width: 800px;
      margin: auto;
    }

    .loading {
      text-align: center;
      font-size: 1.2em;
      padding: 2em 0;
      color: #555;
    }

    /* Generic spoiler styling */
    .spoiler,
    .chatlog__attachment--spoiler {
      position: relative;
      filter: blur(5px);
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    /* Remove blur when revealed */
    .spoiler.revealed,
    .chatlog__attachment--spoiler.revealed {
      filter: none;
    }

    /* This targets any overlay added via ::after or ::before */
    .spoiler::after,
    .chatlog__attachment--spoiler::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .spoiler.revealed::after,
    .chatlog__attachment--spoiler.revealed::after {
      opacity: 0;
    }
    nav select {
      padding: 0.3rem;
      border-radius: 4px;
    }

  </style>
<link rel="stylesheet" href="styles/inject-style.css">
<style>
  body {
    background: url('https://drive.diggy.network/api/public/dl/HztOunHx?inline=true') no-repeat center center fixed !important;
    background-size: cover !important;
    margin: 0; padding: 0;
  }

  #page-wrapper {
    max-width: 960px;
    margin: 40px auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
  }

  body.dark-mode #page-wrapper {
    background: rgba(30, 30, 30, 0.85);
    color: white;
  }
</style>
</head>
<body>








<!-- Keep this open so parts are loaded into it -->
<div id="content">
  <h1>Donny Dump Archive</h1>
  <div class="loading" id="loader">Loading messages...</div>
</div>

<!-- Lazy loading and spoiler logic -->
<script>
  const content = document.getElementById("content");
  const loader = document.getElementById("loader");
  let currentPart = 1;
  let loading = false;
  let finished = false;

  async function loadNextPart() {
    if (loading || finished) return;
    loading = true;
    loader.textContent = `Loading part ${currentPart}...`;

    try {
      const res = await fetch(`donnydump_parts/Donypart${currentPart}.html`);
      if (!res.ok) {
        finished = true;
        loader.textContent = "All messages loaded.";
        return;
      }

      const html = await res.text();
      const wrapper = document.createElement("div");
      wrapper.innerHTML = html;
      content.insertBefore(wrapper, loader);

      currentPart++;
      loading = false;
    } catch (err) {
      console.error(err);
      loader.textContent = "Error loading messages.";
    }
  }

  loadNextPart();

  window.addEventListener("scroll", () => {
    const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 200;
    if (nearBottom) {
      loadNextPart();
    }
  });

  document.addEventListener("click", (e) => {
    let target = e.target;
    while (target && target !== document.body) {
      if (target.classList.contains("spoiler") || target.classList.contains("chatlog__attachment--spoiler")) {
        target.classList.toggle("revealed");
        break;
      }
      target = target.parentElement;
    }
  });
</script>

<!-- Only one button bar script is needed -->
<script src="scripts/inject-button-bar.js" defer></script>

</body>
</html>
