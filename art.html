<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Art Archive</title>
<link href="cats.png" rel="icon" type="image/png"/>
<style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0 1rem;
      background: #f4f4f4;
    }
    #content {
      max-width: 800px;
      margin: auto;
    }
    .loading {
      text-align: center;
      font-size: 1.2em;
      padding: 2em 0;
      color: #555;
    }

    .spoiler, .chatlog__attachment--spoiler {
      filter: blur(5px);
      cursor: pointer;
      transition: filter 0.2s ease;
    }

    .spoiler.revealed,
    .chatlog__attachment--spoiler.revealed {
      filter: none;
    }
  </style>
<link href="style.css" rel="stylesheet"/>
<style>
  body {
    background: url('https://drive.diggy.network/api/public/dl/HztOunHx?inline=true') no-repeat center center fixed !important;
    background-size: cover !important;
    margin: 0; padding: 0;
  }

  #page-wrapper {
    max-width: 960px;
    margin: 40px auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 12px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
  }

  body.dark-mode #page-wrapper {
    background: rgba(30, 30, 30, 0.85);
    color: white;
  }
</style>
</head>
<body>
<div class="button-container">
<button id="contactBtn">Contact</button>
<button id="settingsBtn">Settings</button>
<button id="updateBtn">Update Notes</button>
</div>

<div class="modal" id="settingsModal">
<div class="modal-content">
<h2>Settings</h2>
<label><input id="darkModeToggle" type="checkbox"/> Dark Mode</label><br/>
<label><input id="noBackgroundToggle" type="checkbox"/> Remove Background</label><br/>
<button id="settingsCloseBtn">Close</button>
</div>
</div>

<div class="modal" id="contactModal">
<div class="modal-content">
<h2>Contact</h2>
<p>Email: meowarchive@example.com</p>
<button id="contactCloseBtn">Close</button>
</div>
</div>

<div class="modal" id="updateModal">
<div class="modal-content">
<h2>Update Notes</h2>
<p>Version 25.0603 includes the new welcome screen, improved dark mode, and updated navigation.</p>
<button id="updateCloseBtn">Close</button>
</div>
</div>






<div id="page-wrapper"><!-- Settings Modal --><!-- Contact Modal --><!-- Update Notes Modal --><div id="button-bar-placeholder"></div><div id="content">
<h1>Art Archive</h1>
<div class="loading" id="loader">Loading messages...</div>
</div><script>
    const content = document.getElementById("content");
    const loader = document.getElementById("loader");
    let currentPart = 1;
    let loading = false;
    let finished = false;

    async function loadNextPart() {
      if (loading || finished) return;
      loading = true;
      loader.textContent = `Loading part ${currentPart}...`;

      try {
        // 👇 Change here: look in "donnydump_parts" folder
        const res = await fetch(`art_parts/artpart${currentPart}.html`);
        if (!res.ok) {
          finished = true;
          loader.textContent = "All messages loaded.";
          return;
        }

        const html = await res.text();
        const wrapper = document.createElement("div");
        wrapper.innerHTML = html;
        content.insertBefore(wrapper, loader);

        currentPart++;
        loading = false;
      } catch (err) {
        console.error(err);
        loader.textContent = "Error loading messages.";
      }
    }

    // Load the first part immediately
    loadNextPart();

    // Load more parts as user scrolls
    window.addEventListener("scroll", () => {
      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 200;
      if (nearBottom) {
        loadNextPart();
      }
    });

    document.addEventListener("click", (e) => {
      const target = e.target;

      if (
        target.classList.contains("spoiler") ||
        target.classList.contains("chatlog__attachment--spoiler")
      ) {
        target.classList.toggle("revealed");
      }

      if (
        target.tagName === "IMG" &&
        target.parentElement &&
        (target.parentElement.classList.contains("spoiler") ||
        target.parentElement.classList.contains("chatlog__attachment--spoiler"))
      ) {
        target.parentElement.classList.toggle("revealed");
      }
    });

  </script><script>
    document.addEventListener("click", (e) => {
      const spoiler = e.target.closest(".chatlog__attachment--hidden");
      if (spoiler) {
        spoiler.classList.remove("chatlog__attachment--hidden");
      }
    });
  </script><script src="/scripts/inject-button-bar.js"></script><script defer="True" src="scripts/inject-button-bar.js"></script></div></body>
</html>
